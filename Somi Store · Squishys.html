<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somi Store · Squishys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFDF8;--paper:#F1EEE6;--sand:#C9C4B8;--graphite:#3A3A3A;--ink:#0B0B0B;
  --card:#FFFDF8;--text:#0B0B0B;--muted:#3A3A3A;--line:#0B0B0B;--btn:#0B0B0B;--btn-text:#FFFDF8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B;--paper:#1B1B1B;--card:#0B0B0B;--text:#FFFDF8;--muted:#C9C4B8;--line:#C9C4B8;--btn:#FFFDF8;--btn-text:#0B0B0B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg:#0B0B0B;--paper:#1B1B1B;--card:#0B0B0B;--text:#FFFDF8;--muted:#C9C4B8;--line:#C9C4B8;--btn:#FFFDF8;--btn-text:#0B0B0B;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;border-radius:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300;font-size:1.0625rem;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
h1,h2,h3,.logo{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.01em}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-inline:clamp(1.25rem,5vw,2.5rem)}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

/* Marco de doble borde */
.frame{border:1px solid var(--line);box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--line);background:var(--card)}

/* Encabezado */
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:1.1rem}
.logo{display:block;line-height:0}
.logo img,.foot-logo{height:clamp(2.6rem,7vw,3.4rem);width:auto}
.foot-logo{height:3.4rem;margin:0 auto 1rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .js-logo{filter:invert(1)}}
:root[data-theme="dark"] .js-logo{filter:invert(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--btn);background:var(--btn);color:var(--btn-text);padding:.7rem 1.6rem;font-weight:400;text-decoration:none;letter-spacing:.02em;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--text)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--btn);color:var(--btn-text)}

/* Portada */
.hero{padding-block:clamp(2.5rem,7vw,5.5rem)}
.hero .wrap{display:grid;gap:clamp(1.5rem,5vw,4rem);align-items:center;grid-template-columns:1.15fr .85fr}
h1{font-size:clamp(2.6rem,7vw,5rem);line-height:1;margin:0 0 1.25rem}
.hero p{color:var(--muted);max-width:36ch;margin:0 0 2rem}
.hero-box{padding:clamp(1.25rem,4vw,2.25rem);display:grid;place-items:center;background:var(--paper);min-width:0}
.hero-box button{background:none;border:0;padding:0;width:100%;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.hero-box .blob{width:68%}
.hint{color:var(--muted);font-size:.9rem;margin-top:.75rem;text-align:center;font-style:italic;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.1rem}

/* Squishy */
.blob{--c:var(--sand);--f:#0B0B0B;position:relative;aspect-ratio:1/.92;background:var(--c);border-radius:46% 54% 50% 50%/55% 52% 48% 45%;box-shadow:inset -.5rem -.7rem 0 rgba(11,11,11,.09),inset .4rem .5rem 0 rgba(255,253,248,.3);transform-origin:50% 100%}
.blob::before,.blob::after{content:"";position:absolute;top:44%;width:6%;aspect-ratio:1;border-radius:50%;background:var(--f)}
.blob::before{left:33%}.blob::after{right:33%}
.blob i{position:absolute;left:50%;top:54%;width:12%;aspect-ratio:2/1;transform:translateX(-50%);border-bottom:.16rem solid var(--f);border-radius:0 0 99px 99px}
.blob.squish{animation:squish .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.26,.7)}65%{transform:scale(.93,1.09)}100%{transform:scale(1,1)}}

/* Catálogo */
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.75rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
h2{font-size:clamp(2rem,5vw,2.8rem);margin:0;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--line);background:transparent;padding:.35rem 1.1rem;font-weight:400}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-text)}
.grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));padding:0;margin:0;list-style:none}
.card{padding:1.25rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.thumb{background:var(--paper);display:grid;place-items:center;aspect-ratio:1;overflow:hidden;padding:0;border:0;width:100%;-webkit-tap-highlight-color:transparent}
.thumb .blob{width:60%}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h3{margin:.5rem 0 0;font-size:1.45rem;line-height:1.1}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-top:.5rem;padding-top:.6rem;border-top:1px solid var(--sand)}
.price{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.5rem}
.stock{font-size:.85rem;color:var(--muted)}
.stock.low{color:var(--text);font-style:italic}
.add{padding:.6rem 1rem;font-size:.95rem;margin-top:.25rem}
.add[disabled]{opacity:.4;cursor:not-allowed}
.add[disabled]:hover{background:var(--btn);color:var(--btn-text)}

/* Información */
.info{padding-block:clamp(3rem,7vw,5.5rem)}
.info h2{margin-bottom:1.75rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.info-grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.info-grid div{padding:1.5rem}
.info-grid strong{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-weight:600;margin-bottom:.25rem}
.info-grid span{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:2rem 6.5rem;color:var(--muted);text-align:center;font-size:.95rem}

/* Pedido */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.75rem clamp(1.25rem,5vw,2.5rem);padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px));display:none}
.bar.on{display:block}
.bar-in{max-width:1080px;margin-inline:auto;background:var(--btn);color:var(--btn-text);padding:.6rem .6rem .6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--btn);box-shadow:inset 0 0 0 4px var(--btn),inset 0 0 0 5px var(--btn-text)}
.bar-in .btn{background:var(--btn-text);color:var(--btn);border-color:var(--btn-text);margin:.2rem}
.bar-in .btn:hover{background:transparent;color:var(--btn-text)}
.bar-in button.link{background:none;border:0;color:inherit;text-align:left;padding:0 0 0 .4rem;font-weight:400}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(11,11,11,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{width:100%;max-width:560px;max-height:88%;overflow:auto;padding:2rem 1.75rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:2rem;margin-bottom:1rem}
.line{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--sand)}
.line b{font-weight:500}
.line small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:.6rem}
.qty button{width:2rem;height:2rem;border:1px solid var(--line);background:transparent;line-height:1}
.qty button:hover{background:var(--btn);color:var(--btn-text)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.7rem;margin:1.25rem 0}
.actions{display:flex;gap:.75rem;flex-wrap:wrap}
.actions .btn{flex:1}
@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-box{order:-1}
  .hero-box .blob{width:56%}
}
@media (prefers-reduced-motion:reduce){.blob.squish{animation:none}.btn{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="logo" href="#" id="logo"><img class="js-logo" alt="Somi Store" width="640" height="302"></a>
  <a class="btn ghost" href="#catalogo">Ver catálogo</a>
</div></header>

<main>
<section class="hero"><div class="wrap">
  <div>
    <h1 id="lema"></h1>
    <p id="sub"></p>
    <a class="btn" href="#catalogo">Elegir mis squishys</a>
  </div>
  <div>
    <div class="hero-box frame">
      <button id="heroBtn" aria-label="Apretar el squishy"><div class="blob" id="heroBlob" style="--c:var(--sand)"><i></i></div></button>
    </div>
    <div class="hint">Tócalo y apriétalo</div>
  </div>
</div></section>

<section id="catalogo"><div class="wrap">
  <div class="section-head">
    <h2>Catálogo</h2>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
  </div>
  <ul class="grid" id="grid"></ul>
</div></section>

<section class="info"><div class="wrap">
  <h2>Cómo comprar</h2>
  <div class="info-grid" id="info"></div>
</div></section>
</main>

<footer><div class="wrap"><img class="js-logo foot-logo" alt="Somi Store" width="640" height="302"><div id="foot"></div></div></footer>

<div class="bar" id="bar"><div class="bar-in">
  <button class="link" id="openCart"></button>
  <button class="btn" id="openCart2">Ver pedido</button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido">
  <div class="panel frame">
    <h2>Tu pedido</h2>
    <div id="lines"></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <div class="actions">
      <button class="btn ghost" id="closeCart">Seguir viendo</button>
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    </div>
  </div>
</div>

const COLORES = {
  arena:  { c:"#C9C4B8", f:"#0B0B0B" },
  hueso:  { c:"#E4DFD2", f:"#0B0B0B" },
  grafito:{ c:"#3A3A3A", f:"#FFFDF8" },
  tinta:  { c:"#0B0B0B", f:"#FFFDF8" }
};
const col = k => COLORES[k] || COLORES.arena;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => TIENDA.moneda + " " + n.toFixed(2).replace(/\.00$/, "");
const cart = {};
let filtro = "Todos";

document.title = TIENDA.nombre + " · Squishys";
document.querySelectorAll(".js-logo").forEach(i => { i.src = LOGO; i.alt = TIENDA.nombre; });
$("#lema").textContent = TIENDA.lema;
$("#sub").textContent = TIENDA.sub;
$("#info").innerHTML = TIENDA.info.map(i => `<div class="frame"><strong>${esc(i.t)}</strong><span>${esc(i.d)}</span></div>`).join("");
$("#foot").innerHTML = `${esc(TIENDA.pie)}<br>Instagram ${esc(TIENDA.instagram)}`;

function squish(el){ el.classList.remove("squish"); void el.offsetWidth; el.classList.add("squish"); }
$("#heroBtn").addEventListener("click", () => squish($("#heroBlob")));

function chips(){
  const cats = ["Todos", ...new Set(PRODUCTOS.map(p => p.cat))];
  $("#chips").innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===filtro}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  filtro = b.dataset.c; chips(); grid();
});

function grid(){
  const list = PRODUCTOS.filter(p => filtro==="Todos" || p.cat===filtro);
  $("#grid").innerHTML = list.map(p => {
    const k = col(p.color);
    const media = p.img
      ? `<img src="${esc(p.img)}" alt="${esc(p.nombre)}" loading="lazy">`
      : `<div class="blob" style="--c:${k.c};--f:${k.f}"><i></i></div>`;
    const en = cart[p.id] || 0;
    const agotado = p.stock <= 0;
    const lleno = en >= p.stock;
    const st = agotado ? `<span class="stock low">Agotado</span>`
      : p.stock <= 5 ? `<span class="stock low">Quedan ${p.stock}</span>`
      : `<span class="stock">Disponible</span>`;
    return `<li class="card frame">
      <button class="thumb" data-sq aria-label="Apretar ${esc(p.nombre)}">${media}</button>
      <h3>${esc(p.nombre)}</h3>
      <p>${esc(p.desc)}</p>
      <div class="row"><span class="price">${money(p.precio)}</span>${st}</div>
      <button class="btn add" data-id="${p.id}" ${agotado||lleno?"disabled":""}>${agotado?"Sin stock":lleno?"Máximo en pedido":"Agregar"}</button>
    </li>`;
  }).join("");
}
$("#grid").addEventListener("click", e => {
  const sq = e.target.closest("[data-sq]");
  if(sq){ const b = sq.querySelector(".blob") || sq; squish(b); return; }
  const a = e.target.closest(".add"); if(!a || a.disabled) return;
  const id = +a.dataset.id, p = PRODUCTOS.find(x => x.id===id);
  if((cart[id]||0) < p.stock) cart[id] = (cart[id]||0) + 1;
  update();
});

function update(){
  const ids = Object.keys(cart).filter(k => cart[k] > 0);
  const n = ids.reduce((s,k) => s + cart[k], 0);
  const total = ids.reduce((s,k) => s + cart[k] * PRODUCTOS.find(p => p.id==k).precio, 0);
  $("#bar").classList.toggle("on", n > 0);
  $("#openCart").textContent = n + (n===1 ? " producto, " : " productos, ") + money(total);
  $("#lines").innerHTML = ids.map(k => {
    const p = PRODUCTOS.find(x => x.id==k);
    return `<div class="line"><span><b>${esc(p.nombre)}</b><br><small>${money(p.precio)} c/u</small></span>
      <span class="qty"><button data-m="${k}" aria-label="Quitar uno">−</button><b>${cart[k]}</b><button data-p="${k}" aria-label="Agregar uno">+</button></span></div>`;
  }).join("");
  $("#total").textContent = money(total);
  const msg = `Hola ${TIENDA.nombre}, quiero hacer este pedido:\n` +
    ids.map(k => { const p = PRODUCTOS.find(x => x.id==k); return `• ${cart[k]} × ${p.nombre} (${money(p.precio*cart[k])})`; }).join("\n") +
    `\nTotal: ${money(total)}`;
  $("#wa").href = "https://wa.me/" + TIENDA.whatsapp + "?text=" + encodeURIComponent(msg);
  if(n === 0) $("#sheet").classList.remove("on");
  grid();
}
$("#lines").addEventListener("click", e => {
  const m = e.target.dataset.m, p = e.target.dataset.p;
  if(m){ cart[m]--; if(cart[m] <= 0) delete cart[m]; }
  if(p){ const pr = PRODUCTOS.find(x => x.id==p); if(cart[p] < pr.stock) cart[p]++; }
  update();
});
["#openCart","#openCart2"].forEach(s => $(s).addEventListener("click", () => $("#sheet").classList.add("on")));
$("#closeCart").addEventListener("click", () => $("#sheet").classList.remove("on"));
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") $("#sheet").classList.remove("on"); });
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#sheet").classList.remove("on"); });

chips(); grid(); update();
</script>
</body>
</html>
